<style>
/* Layout: slim sticky bar, full-bleed rotating hero, category image tiles, borderless 2/3/4-column product grid, full-page product view with stacked gallery and sticky action bar, cart/checkout side panel, owner-only admin. Near-white and ink with one tan accent; photography carries the page. */
:root{
  --bg:#f7f6f2; --surface:#ffffff; --ink:#141414; --muted:#6a6a64; --line:#dedcd4;
  --brand:#141414; --brand-fg:#f7f6f2; --accent:#9c7340; --soft:#ebe9e2; --ok:#2f6b46; --warn:#8a5a14;
  --f-ar-display:'Amiri',serif; --f-en-display:'Cormorant Garamond',serif; --f-body:'IBM Plex Sans Arabic',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f0f0e; --surface:#171716; --ink:#efece5; --muted:#a09d95; --line:#2c2c2a; --brand:#efece5; --brand-fg:#141414; --accent:#d3b07a; --soft:#1e1e1c; --ok:#6fbf8c; --warn:#d9a95a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f0f0e; --surface:#171716; --ink:#efece5; --muted:#a09d95; --line:#2c2c2a; --brand:#efece5; --brand-fg:#141414; --accent:#d3b07a; --soft:#1e1e1c; --ok:#6fbf8c; --warn:#d9a95a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:400;font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0}
h1,h2,h3{font-weight:500;line-height:1.2;margin:0;text-wrap:balance}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
img{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin-inline:auto}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:8px 16px}
.bar .wrap{display:flex;align-items:center;gap:8px}
.logo{font-family:var(--f-en-display);font-weight:700;font-size:22px;letter-spacing:.3em;text-decoration:none;margin-inline-end:auto}
.logo img{display:block;width:auto;height:34px}.logo .lg-d{display:none}
.dtop .logo img{width:auto;height:30px}
:root[data-theme="dark"] .logo .lg-l{display:none}:root[data-theme="dark"] .logo .lg-d{display:block}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo .lg-l{display:none}:root:not([data-theme="light"]) .logo .lg-d{display:block}}
.logo small{font-family:var(--f-body);font-size:10px;letter-spacing:.3em;color:var(--muted);font-weight:500;margin-inline-start:6px}
.pill{border:0;background:transparent;padding:6px 10px;font-size:13px;letter-spacing:.06em;min-height:40px}
.pill:hover{color:var(--accent)}
.cartbtn{display:flex;align-items:center;gap:6px}
.cartbtn b{background:var(--brand);color:var(--brand-fg);border-radius:99px;min-width:20px;height:20px;display:inline-grid;place-items:center;font-size:11px;padding-inline:5px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-fg);border-radius:0;padding:12px 22px;font-weight:500;letter-spacing:.04em;text-decoration:none;min-height:48px;font-size:14px}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:13px}
.btn.danger{background:transparent;color:var(--warn);border-color:var(--warn)}
.btn.light{background:transparent;color:#fff;border-color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* hero */
.hero{position:relative;margin-inline:-16px;height:min(82vh,720px);min-height:380px;background:var(--soft);overflow:hidden;touch-action:pan-y}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide>img{width:100%;height:100%;object-fit:cover}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.62),rgba(0,0,0,.05) 55%)}
.slide .txt{position:absolute;z-index:2;inset-inline:0;inset-block-end:0;padding:0 16px 64px;color:#fff}
.slide .txt>div{max-width:1280px;margin-inline:auto}
.slide .k{font-size:12px;letter-spacing:.25em;opacity:.85;margin:0 0 10px}
.slide h1{font-family:var(--f-ar-display);font-size:clamp(34px,6.4vw,76px);font-weight:700;max-width:16ch}
html[lang="en"] .slide h1{font-family:var(--f-en-display);font-weight:600}
.slide p.s{margin:10px 0 20px;max-width:46ch;opacity:.92;font-size:16px}
.hctl{position:absolute;z-index:3;inset-inline:0;inset-block-end:22px;display:flex;gap:6px;justify-content:center}
.hctl button{width:34px;height:3px;border:0;padding:0;background:rgba(255,255,255,.4);min-height:0}
.hctl button[aria-current="true"]{background:#fff}
.hctl button::before{content:"";position:absolute;inset:-12px -2px}
.hctl button{position:relative}
.harr{position:absolute;z-index:3;inset-block-start:50%;transform:translateY(-50%);border:0;background:rgba(0,0,0,.25);color:#fff;width:44px;height:44px;border-radius:50%;font-size:22px}
.harr.p{inset-inline-start:14px}.harr.n{inset-inline-end:14px}
.hvid{position:absolute;z-index:3;inset-block-start:14px;inset-inline-end:16px;color:#fff;font-size:13px;text-decoration:none;background:rgba(0,0,0,.35);padding:6px 12px;border-radius:99px}
.trust{display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:center;padding-block:16px;color:var(--muted);font-size:13px;letter-spacing:.03em}
.trust span::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-inline-end:8px;vertical-align:middle}
.sec{padding-block:40px 8px}
.sec h2{font-size:13px;letter-spacing:.28em;font-weight:600;margin-bottom:18px;text-transform:uppercase}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tile{position:relative;border:0;padding:0;aspect-ratio:4/5;overflow:hidden;background:var(--soft);display:block;width:100%}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.tile:hover img{transform:scale(1.03)}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.5),transparent 55%)}
.tile span{position:absolute;z-index:2;inset-inline:16px;inset-block-end:14px;color:#fff;font-size:17px;font-weight:500;text-align:start}
/* grid */
.tabs{display:flex;flex-wrap:wrap;gap:4px 22px;margin-bottom:18px}
.tab{border:0;background:transparent;padding:6px 0;font-size:14px;color:var(--muted);border-bottom:1px solid transparent;min-height:36px}
.tab[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.shoptools{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.shoptools .tabs{margin-bottom:0}
.vt{display:flex;gap:6px;flex:none}
.vt button{width:40px;height:40px;border:1px solid var(--line);background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0}
.vt button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.vt svg{width:20px;height:20px}
.grid.one{grid-template-columns:1fr}
@media (min-width:760px){.grid.one{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1100px){.grid.one{grid-template-columns:repeat(3,1fr)}}
.grid.one .pm h3{font-size:18px}
.wafab{position:fixed;inset-inline-end:14px;inset-block-end:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;width:54px;height:54px;border-radius:50%;background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.28);text-decoration:none}
.wafab svg{width:29px;height:29px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 10px}
@media (min-width:760px){.grid{grid-template-columns:repeat(3,1fr);gap:30px 14px}}
@media (min-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}
.pc{min-width:0}
.pimg{display:block;width:100%;aspect-ratio:4/5;position:relative;border:0;padding:0;overflow:hidden;background:var(--soft)}
.pimg img,.pimg svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pimg svg{padding:14%}
.pimg .i2{opacity:0;transition:opacity .4s}
.pimg:hover .i2{opacity:1}
.soldout{position:absolute;z-index:2;inset-block-start:8px;inset-inline-start:8px;background:var(--ink);color:var(--bg);font-size:11px;padding:2px 10px}
.pm{padding-top:10px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pm h3{font-size:14px;font-weight:500}
.price{font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.price.ask{color:var(--muted);font-size:12px}
.b2b{margin-block:56px 8px;border-block:1px solid var(--line);padding:30px 0;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.b2b h2{font-size:22px;letter-spacing:0;text-transform:none;margin:0 0 6px;font-weight:500}
.b2b p{margin:0;color:var(--muted);max-width:60ch}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px}
.steps div{border-top:1px solid var(--ink);padding-top:12px}
.steps h3{font-size:15px;margin-bottom:4px}
.steps p{margin:0;color:var(--muted);font-size:14px}
.sub{color:var(--muted);margin:-8px 0 18px;font-size:14px}
.paystrip{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;align-items:center}
.paystrip b{font-size:12px;letter-spacing:.14em;font-weight:600;margin-inline-end:6px}
.paystrip span{border:1px solid var(--line);padding:4px 12px;font-size:13px;color:var(--ink);background:var(--surface)}
.aichip{position:absolute;inset-block-end:10px;inset-inline-start:10px;background:rgba(0,0,0,.55);color:#fff;font-size:11.5px;line-height:1.4;padding:4px 10px;max-width:70%;z-index:2}
.aicap{font-size:12.5px;color:var(--muted);margin:8px 0 0;padding-inline:2px}
.flinks{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px}
.flinks a,.flinks button{background:none;border:0;padding:8px 2px;min-height:36px;font-size:13px;color:var(--ink);text-decoration:underline;cursor:pointer}
.fnote{flex-basis:100%;font-size:12px;margin:0}
.info{inset:0;padding:20px 18px calc(28px + env(safe-area-inset-bottom,0px));z-index:44}
.info-in{max-width:720px;margin-inline:auto}
.info h3{font-size:16px;margin:20px 0 4px;font-weight:600}
.info p{margin:0 0 10px;color:var(--muted);font-size:15px}
.info .navs{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}
.info .navs button{border:1px solid var(--line);background:var(--surface);padding:6px 12px;font-size:13px}
.info .navs button[aria-pressed=true]{border-color:var(--ink)}
.dlnote{font-size:13px;color:var(--muted);margin:0 0 14px}
footer{margin-top:48px;border-top:1px solid var(--line);padding-block:26px 40px;color:var(--muted);font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;gap:14px 36px;justify-content:space-between}
footer a{color:var(--ink)}
.ov{position:fixed;inset:0;background:rgba(10,10,10,.5);z-index:40;display:none}
.ov.on{display:block}
.sheet{position:fixed;z-index:41;background:var(--bg);display:none;overflow:auto;overscroll-behavior:contain}
.sheet.on{display:block}
.detail{inset:0;z-index:42;padding:0}
.panel{inset-block:0;inset-inline-end:0;width:min(460px,100%);padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));z-index:43}
.admin{inset:0;z-index:44;padding:18px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.admin-in{max-width:980px;margin-inline:auto}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sheet header h2{font-size:24px;font-weight:500}
.x{border:0;background:var(--surface);border-radius:50%;width:42px;height:42px;font-size:22px;line-height:1;flex:none;box-shadow:0 0 0 1px var(--line)}
/* product page */
.dtop{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:linear-gradient(var(--bg),transparent)}
.dtop .logo{margin:0;font-size:18px}
.dbody{max-width:1280px;margin-inline:auto;padding:0 16px 24px;display:grid;gap:22px}
@media (min-width:900px){.dbody{grid-template-columns:1.25fr 1fr;gap:48px;align-items:start}.dinfo{position:sticky;top:70px}}
.gal{position:relative;min-width:0}
.gscroll{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:6px;scrollbar-width:none}
.gscroll::-webkit-scrollbar{display:none}
.gscroll>*{flex:0 0 100%;scroll-snap-align:center;background:var(--soft)}
.gscroll img{width:100%;height:auto;max-height:80vh;object-fit:contain;margin-inline:auto}
.gscroll svg{width:100%;height:auto;aspect-ratio:1/1;padding:12%}
.gcount{position:absolute;inset-block-end:10px;inset-inline-end:10px;background:rgba(0,0,0,.5);color:#fff;font-size:12px;padding:2px 10px;border-radius:99px}
@media (min-width:900px){
  .gscroll{display:grid;grid-template-columns:1fr 1fr;overflow:visible;gap:6px}
  .gscroll>*:first-child{grid-column:1/-1}
  .gscroll>*{flex:none}
  .gcount{display:none}
  .gscroll img{max-height:none}
}
.dinfo h2{font-size:26px;font-weight:500;margin-bottom:6px}
.dinfo .price{font-size:20px}
.dinfo .dd{color:var(--muted);margin:10px 0}
.opt{margin:16px 0}
.opt label.t{display:block;font-size:12px;letter-spacing:.1em;color:var(--muted);margin-bottom:6px}
.vals{display:flex;flex-wrap:wrap;gap:8px}
.val{border:1px solid var(--line);background:var(--surface);padding:7px 16px;min-height:42px;font-size:14px}
.val[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--surface)}
.qty button{border:0;background:transparent;width:42px;height:42px;font-size:20px}
.qty span{min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted)}
.abar{position:sticky;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.abar>div{max-width:1280px;margin-inline:auto;display:flex;gap:10px;flex-wrap:wrap}
.abar .btn{flex:1 1 180px}
.line{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line .th{background:var(--soft);aspect-ratio:1/1;overflow:hidden}
.line .th svg,.line .th img{width:100%;height:100%;object-fit:cover}
.line h4{margin:0;font-size:14px;font-weight:500}
.line small{color:var(--muted);display:block}
.line .rm{border:0;background:transparent;color:var(--muted);font-size:13px;text-decoration:underline;padding:0}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:0;padding:10px 12px;min-height:44px}
.fld textarea{min-height:80px;resize:vertical}
.fld input[type="checkbox"]{width:auto;min-height:0}
.radios{display:grid;gap:8px;margin-bottom:12px}
.radios label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--surface);padding:10px 12px;cursor:pointer}
.radios input{margin-top:5px;accent-color:var(--ink)}
.radios small{display:block;color:var(--muted)}
.radios label:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
fieldset{border:0;padding:0;margin:0 0 4px}
legend{font-size:13px;color:var(--muted);padding:0;margin-bottom:6px}
.sum{display:flex;justify-content:space-between;gap:10px;padding:14px 0;font-weight:600}
.done{background:var(--soft);padding:16px;margin-top:14px}
.done pre{white-space:pre-wrap;word-break:break-word;font-family:var(--f-body);font-size:13px;margin:10px 0;background:var(--surface);border:1px solid var(--line);padding:10px;max-height:200px;overflow:auto}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.toast{position:fixed;inset-inline:16px;inset-block-end:calc(80px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:fit-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:10px 18px;z-index:60;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
/* admin */
.tabsA{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tabsA button{border:0;background:transparent;padding:10px 16px;border-bottom:2px solid transparent;min-height:44px}
.tabsA button[aria-pressed="true"]{border-bottom-color:var(--ink);font-weight:600}
.status{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-bottom:12px}
.status .dirty{color:var(--warn);font-weight:600}
.arow{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);background:var(--surface);margin-bottom:8px}
.arow .th{width:56px;height:56px;background:var(--soft);overflow:hidden;display:grid;place-items:center}
.arow .th img,.arow .th svg{width:100%;height:100%;object-fit:cover}
.arow small{display:block;color:var(--muted)}
.arow .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.arow>div{min-width:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.box{border:1px solid var(--line);padding:14px;margin-bottom:14px;background:var(--surface)}
.box h3{font-size:17px;margin-bottom:10px}
.imgs{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.imgs figure{margin:0;width:110px;display:grid;gap:4px}
.imgs img{width:110px;height:110px;object-fit:cover;border:1px solid var(--line)}
.imgs .btn{min-height:30px;padding:3px 8px;font-size:12px}
.linkbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.linkbox code{direction:ltr;background:var(--soft);padding:3px 8px;word-break:break-all}
@media (max-width:760px){

function renderAnalyticsConsent(forceOpen){
  var banner=$("analyticsConsent");
  if(!/^G-[A-Z0-9]+$/i.test(GA4_MEASUREMENT_ID)){banner.hidden=true;return}
  var choice=lsGet("kavora-analytics-consent");
  if(!forceOpen&&(choice==="accepted"||choice==="rejected")){banner.hidden=true;return}
  $("analyticsConsentCopy").textContent=t("analyticsConsent");
  banner.querySelector('[data-consent="accept"]').textContent=t("analyticsAccept");
  banner.querySelector('[data-consent="reject"]').textContent=t("analyticsReject");
  banner.hidden=false;
}
function initializeAnalytics(){
  if(!/^G-[A-Z0-9]+$/i.test(GA4_MEASUREMENT_ID)||!analyticsAllowed())return;
  window.dataLayer=window.dataLayer||[];
  window.gtag=window.gtag||function(){window.dataLayer.push(arguments)};
  window.gtag("consent","default",{analytics_storage:"denied"});
  window.gtag("consent","update",{analytics_storage:"granted"});
  if(!analyticsInitialized){
    window.gtag("js",new Date());
    window.gtag("config",GA4_MEASUREMENT_ID,{send_page_view:false});
    var ga=document.createElement("script");
    ga.async=true;ga.id="kavora-ga4";
    ga.src="https://www.googletagmanager.com/gtag/js?id="+encodeURIComponent(GA4_MEASUREMENT_ID);
    document.head.appendChild(ga);
    analyticsInitialized=true;
    trackPageView();
  }
}
function setAnalyticsConsent(allowed){
  lsSet("kavora-analytics-consent",allowed?"accepted":"rejected");
  if(!allowed&&analyticsInitialized&&window.gtag)window.gtag("consent","update",{analytics_storage:"denied"});
  renderAnalyticsConsent(false);

}

function rng(seed){var s=seed;return function(){s=(s*16807)%2147483647;return (s-1)/2147483646}}
var HIDE="M60 30C80 16 120 16 140 30C160 40 170 62 160 82C173 102 176 132 160 152C150 174 135 186 118 180C108 192 92 192 82 180C65 186 50 174 40 152C24 132 27 102 40 82C30 62 40 40 60 30Z";
function art(p,pi,uid){
  var c=(p.pal&&(p.pal[pi]||p.pal[0]))||["#c79a68","#a47443"], base=c[0], acc=c[1], i, r=rng(p.id.length*97+pi*13+7), out="";
  out+='<defs><clipPath id="c'+uid+'"><path d="'+HIDE+'"/></clipPath></defs><path d="'+HIDE+'" fill="'+base+'"/>';
  out+='<g clip-path="url(#c'+uid+')" stroke="'+acc+'" stroke-width="1" fill="none" opacity=".55">';
  for(i=0;i<9;i++)out+='<path d="M20 '+(30+i*18)+'C80 '+(20+i*18+r()*16)+' 120 '+(40+i*18-r()*16)+' 190 '+(30+i*18)+'"/>';
  out+='</g><path d="'+HIDE+'" fill="none" stroke="'+acc+'" stroke-opacity=".35" stroke-width="1.5"/>';
  return '<svg viewBox="0 0 200 200" role="img" aria-hidden="true">'+out+'</svg>';
}
function gal(p,s){var a=(p.imgs||[]).slice(),k=p.cimg&&p.cimg[colorIdx(p,s)];if(k>0&&a[k]){var x=a.splice(k,1)[0];a.unshift(x)}return a}

function pic(p,ci,uid){

async function onSubmit(e){
  e.preventDefault();
  form={name:$("f_name").value.trim(),phone:$("f_phone").value.trim(),country:$("f_country").value.trim(),city:$("f_city").value.trim(),addr:$("f_addr").value.trim(),notes:$("f_notes").value.trim(),ship:radioVal("ship"),pay:radioVal("pay")};
  if(!form.name||!form.phone||!form.country||!form.addr){$("ferr").hidden=false;return}

  if(API_BASE_URL){
    try{

      orderSubmission={status:"saved",id:saved.orderId};
      trackEvent("order_request_submitted",{order_id:saved.orderId,item_count:cart.length});
      trackEvent("order_request_confirmation_view",{});
    }catch(error){
      orderSubmission={status:"unconfirmed",id:""};

var notifiedKey="";
function notifyOrder(){
  if(notifiedKey===orderSubmissionKey)return;notifiedKey=orderSubmissionKey;
  try{
    var A=(window.KAVORA_CONFIG&&window.KAVORA_CONFIG.alerts)||{},tt=totals();
    var total=tt.hasUsd?usdTxt(tt.usd):(tt.legacy?money(tt.sum):"");
    var items=cart.map(function(l){var p=prod(l.id);return p.ar.n+" x"+l.qty+" ("+lineLabel(l)+")"}).join(" | ");
    var ref=orderSubmissionKey.slice(0,8).toUpperCase();
    if(A.ntfyTopic)fetch("https://ntfy.sh/",{method:"POST",body:JSON.stringify({topic:A.ntfyTopic,title:"طلب جديد "+ref,message:cart.map(function(l){return prod(l.id).ar.n+" x"+l.qty}).join(", ")+(total?" · "+total:"")+" · "+form.country+" · التفاصيل في الجدول",priority:4})}).catch(function(){});
    if(A.ordersWebhook)fetch(A.ordersWebhook,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({type:"retail",ref:ref,lang:lang,name:form.name,phone:form.phone,country:form.country,city:form.city,address:form.addr,shipping:lab(SHIP,form.ship),payment:lab(PAY,form.pay),items:items,total:total,currency:cmode(),notes:form.notes})}).catch(function(){});
    trackEvent("order_alert_sent",{});
  }catch(e){}
}
function lab(arr,k){for(var i=0;i<arr.length;i++)if(arr[i].k===k)return arr[i][lang];return k}
function newSubmissionId(){
  if(window.crypto&&typeof window.crypto.randomUUID==="function")return window.crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,function(c){var r=Math.random()*16|0;return(c==="x"?r:(r&3|8)).toString(16)});
}
async function persistOrderRequest(){
  var payload={
    submissionId:orderSubmissionKey,language:lang,customerName:form.name,phone:form.phone,
    country:form.country,city:form.city,address:form.addr,shippingMethod:lab(SHIP,form.ship),
    paymentMethod:lab(PAY,form.pay),notes:form.notes||undefined,
    items:cart.map(function(line){var p=prod(line.id);return{productId:line.id,productName:p[lang].n,optionSummary:lineLabel(line),quantity:line.qty}})
  };
  var controller=new AbortController();
  var timeout=setTimeout(function(){controller.abort()},10000);
  try{
    var response=await fetch(API_BASE_URL+"/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload),signal:controller.signal});
    var result=await response.json().catch(function(){return null});
    if(!response.ok||!result||!result.orderId)throw new Error("Order request could not be confirmed");
    return result;
  }finally{clearTimeout(timeout)}
}
function buildMsg(){
  var ar=lang==="ar",lines=[];
  lines.push(xt("msgTitle"),"");
  cart.forEach(function(l,i){var p=prod(l.id),u=unit(p,l.sel);
    lines.push((i+1)+". "+p[lang].n+" × "+l.qty);lines.push("   "+lineLabel(l));
    if(isSqm(p)){var si=sizeInfo(p,l.sel);if(si.valid){var e=estTxt(si.usd);lines.push("   "+xt("msgIndic")+": "+usdTxt(si.usd)+" "+xt("perPiece")+(e?" ("+e+")":""))}}
    else if(u!=null)lines.push("   "+money(u));
  });
  var tt=totals();
  if(tt.hasUsd){var eu=estTxt(tt.usd);lines.push("",xt("msgSub")+": "+usdTxt(tt.usd)+(eu?" ("+eu+")":""),xt("msgNoteSub"))}
  if(tt.legacy)lines.push("",(tt.all?(ar?"الإجمالي: ":"Total: "):(ar?"مجموع الأسعار المعلنة: ":"Listed subtotal: "))+money(tt.sum));
  if(!tt.hasUsd&&!tt.legacy)lines.push("",ar?"الأسعار: عند الطلب":"Prices: on request");
  lines.push("",(ar?"الاسم: ":"Name: ")+form.name,(ar?"الهاتف: ":"Phone: ")+form.phone,(ar?"الدولة: ":"Country: ")+form.country);
  lines.push(xt("msgCur")+": "+(cmode()==="EGP"?"EGP ("+fx.date+", "+fx.src+") / USD":"USD"));
  if(orderSubmission.id)lines.push((ar?"رقم الطلب: ":"Order request ID: ")+orderSubmission.id);
  if(form.city)lines.push((ar?"المحافظة/المدينة: ":"City: ")+form.city);
  lines.push((ar?"العنوان: ":"Address: ")+form.addr,(ar?"الشحن: ":"Shipping: ")+lab(SHIP,form.ship),(ar?"الدفع: ":"Payment: ")+lab(PAY,form.pay));
  if(form.notes)lines.push((ar?"ملاحظات: ":"Notes: ")+form.notes);
  return lines.join("\n");
}

var RUG={rates:{hand:{loc:1000,exp:1500,lin:600},mach:{loc:700,exp:1000,lin:250}},min:30,max:600,rect:[[120,180],[160,230],[200,300]],round:[[100],[150],[200]]};

function fxLoad(cur,done){

  var cache=null;try{cache=JSON.parse(lsGet("kavora-fx-"+cur)||"null")}catch(e){}

  set({cur:cur,rate:0,date:"",src:"",status:"loading"});

/* --- image viewer --- */
var lb={on:false,i:0,srcs:[],alt:"",s:1,x:0,y:0,opener:null,ptr:{},d0:0,s0:1,sx:0,sy:0,x0:0,y0:0,moved:false};
function lbImg(){return $("lbImg")}
function lbClamp(){
  var im=lbImg(),st=$("lbStage"),w=im.offsetWidth*lb.s,h=im.offsetHeight*lb.s,mx=Math.max(0,(w-st.clientWidth)/2),my=Math.max(0,(h-st.clientHeight)/2);
  lb.x=Math.max(-mx,Math.min(mx,lb.x));lb.y=Math.max(-my,Math.min(my,lb.y));
}
function lbApply(){
  lb.s=Math.max(1,Math.min(4,lb.s));if(lb.s===1){lb.x=0;lb.y=0}else lbClamp();
  lbImg().style.transform="translate("+lb.x+"px,"+lb.y+"px) scale("+lb.s+")";
  $("lbStage").classList.toggle("zoomed",lb.s>1);
  $("lbOut").disabled=lb.s<=1;$("lbIn").disabled=lb.s>=4;$("lbReset").disabled=lb.s===1;
}
function lbShow(i){
  var n=lb.srcs.length;lb.i=(i+n)%n;lb.s=1;lb.x=0;lb.y=0;
  var im=lbImg();im.src=lb.srcs[lb.i];im.alt=lb.alt+(n>1?" — "+xt("imgOf")+" "+(lb.i+1)+"/"+n:"");
  $("lbCount").textContent=n>1?(lb.i+1)+" / "+n:"";
  $("lbPrev").hidden=$("lbNext").hidden=n<2;
  lbApply();
}
function openLb(i,opener){
  if(!cur||!cur.imgs||!cur.imgs.length)return;
  lb.srcs=gal(cur,sel);lb.alt=cur[lang].n;lb.opener=opener||null;lb.on=true;
  var L=T[lang];$("lb").setAttribute("aria-label",xt("lbLabel"));
  $("lbIn").setAttribute("aria-label",xt("lbIn"));$("lbOut").setAttribute("aria-label",xt("lbOut"));$("lbReset").setAttribute("aria-label",xt("lbReset"));
  $("lbPrev").setAttribute("aria-label",xt("lbPrev"));$("lbNext").setAttribute("aria-label",xt("lbNext"));$("lbX").setAttribute("aria-label",xt("lbClose"));
  $("lbHint").textContent=xt("lbHint");
  $("lb").hidden=false;lbShow(i);$("lbX").focus();
  trackEvent("image_zoom_open",{product_id:cur.id,language:lang});
}
function closeLb(){
  if(!lb.on)return;lb.on=false;lb.ptr={};$("lb").hidden=true;lbImg().removeAttribute("src");
  if(lb.opener&&document.contains(lb.opener))try{lb.opener.focus()}catch(e){}
}
window.closeLbSafe=function(){closeLb()};
function lbZoom(f){lb.s*=f;lbApply()}
(function(){
  var st=$("lbStage");
  st.addEventListener("pointerdown",function(e){
    try{st.setPointerCapture(e.pointerId)}catch(_){}lb.ptr[e.pointerId]={x:e.clientX,y:e.clientY};lb.moved=false;
    var ids=Object.keys(lb.ptr);
    if(ids.length===2){var a=lb.ptr[ids[0]],b=lb.ptr[ids[1]];lb.d0=Math.hypot(a.x-b.x,a.y-b.y)||1;lb.s0=lb.s}
    else{lb.sx=e.clientX;lb.sy=e.clientY;lb.x0=lb.x;lb.y0=lb.y;st.classList.add("drag")}
  });
  st.addEventListener("pointermove",function(e){
    if(!lb.ptr[e.pointerId])return;lb.ptr[e.pointerId]={x:e.clientX,y:e.clientY};
    var ids=Object.keys(lb.ptr);
    if(ids.length===2){var a=lb.ptr[ids[0]],b=lb.ptr[ids[1]];lb.s=lb.s0*(Math.hypot(a.x-b.x,a.y-b.y)/lb.d0);lb.moved=true;lbApply()}
    else if(lb.s>1){lb.x=lb.x0+(e.clientX-lb.sx);lb.y=lb.y0+(e.clientY-lb.sy);if(Math.abs(e.clientX-lb.sx)+Math.abs(e.clientY-lb.sy)>4)lb.moved=true;lbApply()}
  });
  function up(e){
    delete lb.ptr[e.pointerId];st.classList.remove("drag");
    var ids=Object.keys(lb.ptr);if(ids.length===1){var q=lb.ptr[ids[0]];lb.sx=q.x;lb.sy=q.y;lb.x0=lb.x;lb.y0=lb.y}
  }
  st.addEventListener("pointerup",up);st.addEventListener("pointercancel",up);
  st.addEventListener("dblclick",function(e){if(lb.s>1){lb.s=1}else{lb.s=2.5}lbApply()});
  st.addEventListener("wheel",function(e){e.preventDefault();lbZoom(e.deltaY<0?1.2:1/1.2)},{passive:false});
  $("lbIn").addEventListener("click",function(){lbZoom(1.5)});
  $("lbOut").addEventListener("click",function(){lbZoom(1/1.5)});
  $("lbReset").addEventListener("click",function(){lb.s=1;lbApply()});
  $("lbX").addEventListener("click",closeLb);
  $("lbPrev").addEventListener("click",function(){lbShow(lb.i-1)});
  $("lbNext").addEventListener("click",function(){lbShow(lb.i+1)});
  window.addEventListener("resize",function(){if(lb.on)lbApply()});
  document.addEventListener("keydown",function(e){
    if(lb.on){
      if(e.key==="Escape"){e.stopImmediatePropagation();e.preventDefault();closeLb();return}
      var rtl=document.documentElement.dir==="rtl";
      if(e.key==="ArrowRight"){e.preventDefault();lbShow(lb.i+(rtl?-1:1))}
      else if(e.key==="ArrowLeft"){e.preventDefault();lbShow(lb.i+(rtl?1:-1))}
      else if(e.key==="+"||e.key==="="){e.preventDefault();lbZoom(1.5)}
      else if(e.key==="-"){e.preventDefault();lbZoom(1/1.5)}
      else if(e.key==="0"){e.preventDefault();lb.s=1;lbApply()}
      else if(e.key==="Tab"){
        var f=Array.prototype.filter.call($("lb").querySelectorAll("button"),function(b){return !b.hidden&&!b.disabled});
        if(!f.length)return;var first=f[0],last=f[f.length-1];
        if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
        else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
        else if(f.indexOf(document.activeElement)<0){e.preventDefault();first.focus()}
      }
      return;
    }
  },true);
})();

/* ===== EVENTS ===== */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-open],[data-cat],[data-close],[data-opt],[data-q],[data-addcart],[data-copylink],[data-lq],[data-rm],[data-go],[data-copymsg],[data-a],[data-info],[data-hl],[data-hs],[data-hg],[data-tile],[data-consent],[data-analytics-settings]");
  if(!el){if(e.target.id==="ov")closeAll();return}
  if(el.dataset.consent){setAnalyticsConsent(el.dataset.consent==="accept")}
  else if(el.dataset.analyticsSettings!==undefined){renderAnalyticsConsent(true)}
  else if(el.dataset.info){e.preventDefault();openInfo(el.dataset.info)}
  else if(el.dataset.a)adminAct(el);
  else if(el.dataset.hl){slideLinkAct(el.dataset.hl)}
  else if(el.dataset.hg!==undefined){showSlide(+el.dataset.hg);startHero()}
  else if(el.dataset.hs&&el.classList.contains("harr")){showSlide(heroI+ +el.dataset.hs);startHero()}
  else if(el.dataset.tile){filter=el.dataset.tile;renderChips();renderGrid();$("shop").scrollIntoView({behavior:"smooth"})}
  else if(el.dataset.open)openDetail(el.dataset.open);
  else if(el.dataset.cat){filter=el.dataset.cat;renderChips();renderGrid()}
  else if(el.dataset.close){e.preventDefault();closeAll()}
  else if(el.dataset.opt){sel[el.dataset.opt]=+el.dataset.i;renderDetail()}

  else if(el.dataset.addcart){addToCart()}
  else if(el.dataset.copylink){copy(pageLink(cur.id),t("copied"))}
  else if(el.dataset.lq){var a=el.dataset.lq.split("|"),l=cart[+a[0]];l.qty=Math.max(1,Math.min(99,l.qty+ +a[1]));saveCart();renderCartCount();renderPanel()}
  else if(el.dataset.rm){cart.splice(+el.dataset.rm,1);saveCart();renderCartCount();renderPanel()}
  else if(el.dataset.go){
    if(el.dataset.go==="form"){
      if(step==="done"){orderSubmissionKey="";orderSubmission={status:"manual_only",id:""}}

      trackEvent("checkout_start",{item_count:cart.length,language:lang});
    }
    step=el.dataset.go;renderPanel();$("panel").scrollTop=0
  }
  else if(el.dataset.copymsg){copy(buildMsg(),t("msgCopied"))}
});

function copy(text,msg){
  function fallback(){var ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast(msg)}catch(x){toast("تعذر النسخ")}document.body.removeChild(ta)}
  try{navigator.clipboard.writeText(text).then(function(){toast(msg)},fallback)}catch(x){fallback()}
}
